name: Build & Test Music Player

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  workflow_dispatch:

jobs:
  build:
    name: Flutter Analyze, Test & APK Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Cache Flutter Pub Packages
        uses: actions/cache@v4
        with:
          path: ~/.pub-cache
          key: ${{ runner.os }}-pub-${{ hashFiles('**/pubspec.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pub-

      - name: Cache Gradle Dependencies & Wrapper
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Cache Android NDK & SDK Components
        uses: actions/cache@v4
        with:
          path: |
            /usr/local/lib/android/sdk/ndk
            /usr/local/lib/android/sdk/platforms/android-36
          key: ${{ runner.os }}-android-ndk-sdk-36
          restore-keys: |
            ${{ runner.os }}-android-ndk-sdk-

      - name: Setup Android Scaffolding & Configuration
        run: |
          if [ ! -d "android" ]; then
            echo "Generating Flutter Android scaffolding..."
            flutter create --platforms=android --org com.offline.musicplayer .
          fi
          echo "Applying custom Android configurations..."
          if [ -f "android/app/build.gradle.kts" ]; then
            rm -f android/app/build.gradle.kts
          fi
          if [ -f "android/build.gradle.kts" ]; then
            rm -f android/build.gradle.kts
          fi
          cp -f android_config/build.gradle android/app/build.gradle
          cat android_config/root_build.gradle > android/build.gradle
          cp -f android_config/AndroidManifest.xml android/app/src/main/AndroidManifest.xml
          cat android_config/gradle.properties >> android/gradle.properties

      - name: Install Dependencies
        run: flutter pub get

      - name: Analyze Project Code
        run: flutter analyze

      - name: Run Unit & Widget Tests
        run: flutter test

      - name: Build Release APK
        run: flutter build apk --release

      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: music-player-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14
