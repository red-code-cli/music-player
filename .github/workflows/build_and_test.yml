name: Build & Test Music Player

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  workflow_dispatch:

jobs:
  build:
    name: Flutter Analyze, Test & APK Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Setup Android Scaffolding & Configuration
        run: |
          if [ ! -d "android" ]; then
            echo "Generating Flutter Android scaffolding..."
            flutter create --platforms=android --org com.offline.musicplayer .
          fi
          echo "Applying custom AndroidManifest and build.gradle for offline player & audio_service..."
          if [ -f "android/app/build.gradle.kts" ]; then
            rm -f android/app/build.gradle.kts
          fi
          cp -f android_config/build.gradle android/app/build.gradle
          cp -f android_config/AndroidManifest.xml android/app/src/main/AndroidManifest.xml

      - name: Install Dependencies
        run: flutter pub get

      - name: Analyze Project Code
        run: flutter analyze

      - name: Run Unit & Widget Tests
        run: flutter test

      - name: Build Release APK
        run: flutter build apk --release

      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: music-player-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14
